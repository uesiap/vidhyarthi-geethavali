<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultimate Storage Wipe</title>

<style>
    body {
        font-family: monospace;
        padding: 20px;
        background: #111;
        color: #00ff88;
    }

    h2 {
        color: #00ffaa;
    }

    button {
        padding: 10px 15px;
        margin-right: 10px;
        margin-bottom: 10px;
        cursor: pointer;
        background: #222;
        color: white;
        border: 1px solid #555;
        border-radius: 5px;
    }

    button:hover {
        background: #333;
    }

    .danger {
        border-color: #ff4444;
        color: #ff4444;
    }

    #out {
        background: black;
        padding: 15px;
        border: 1px solid #00ff88;
        border-radius: 5px;
        white-space: pre-wrap;
        overflow-x: auto;
    }

    #status {
        margin-bottom: 15px;
        color: yellow;
    }
</style>
</head>

<body>

<h2>Ultimate Site Storage Purge</h2>

<button onclick="refresh()">
    Check Usage
</button>

<button class="danger" onclick="nukeAllData()">
    Nuke Everything & Reload
</button>

<div id="status"></div>

<pre id="out">Loading...</pre>

<script>

function logStatus(msg) {
    document.getElementById("status").textContent = msg;
}

function kb(v) {
    return (v / 1024).toFixed(2) + " KB";
}

// ----------------------------------------------------
// Real cache size calculation
// ----------------------------------------------------
async function getActualCacheSize() {

    let total = 0;

    const names = await caches.keys();

    for (const name of names) {

        const cache = await caches.open(name);

        const requests = await cache.keys();

        for (const req of requests) {

            try {

                const res = await cache.match(req);

                if (!res) continue;

                const blob = await res.clone().blob();

                total += blob.size;

            } catch (e) {

                console.warn("Skipped opaque response", req.url);
            }
        }
    }

    return total;
}

// ----------------------------------------------------
// IndexedDB delete helper
// ----------------------------------------------------
async function deleteIndexedDBs() {

    if (!indexedDB.databases) {
        return [];
    }

    const dbs = await indexedDB.databases();

    await Promise.all(

        dbs.map(db => {

            return new Promise((resolve, reject) => {

                if (!db.name) {
                    resolve();
                    return;
                }

                const req =
                    indexedDB.deleteDatabase(db.name);

                req.onsuccess = () => resolve();

                req.onerror = () =>
                    reject(req.error);

                req.onblocked = () =>
                    reject("Blocked: " + db.name);
            });
        })
    );

    return dbs;
}

// ----------------------------------------------------
// Clear cookies aggressively
// ----------------------------------------------------
function clearCookies() {

    const cookies =
        document.cookie.split(";");

    const hostname =
        location.hostname;

    const domains = [
        hostname,
        "." + hostname
    ];

    const paths = [
        "/"
    ];

    for (const cookie of cookies) {

        const eqPos = cookie.indexOf("=");

        const name =
            eqPos > -1
                ? cookie.substr(0, eqPos).trim()
                : cookie.trim();

        for (const domain of domains) {

            for (const path of paths) {

                document.cookie =
                    `${name}=; ` +
                    `expires=Thu, 01 Jan 1970 00:00:00 GMT; ` +
                    `path=${path}; ` +
                    `domain=${domain};`;

                document.cookie =
                    `${name}=; Max-Age=0; path=${path};`;
            }
        }
    }
}

// ----------------------------------------------------
// Nuclear wipe
// ----------------------------------------------------
async function nukeAllData() {

    const ok = confirm(
        "Delete ALL possible site data?"
    );

    if (!ok) return;

    try {

        // ----------------------------
        // Cache Storage
        // ----------------------------
        logStatus("Deleting Cache API...");

        const cacheNames =
            await caches.keys();

        await Promise.all(
            cacheNames.map(name =>
                caches.delete(name)
            )
        );

        // ----------------------------
        // Service Workers
        // ----------------------------
        logStatus("Unregistering Service Workers...");

        if (navigator.serviceWorker) {

            const regs =
                await navigator.serviceWorker.getRegistrations();

            await Promise.all(
                regs.map(r => r.unregister())
            );
        }

        // ----------------------------
        // IndexedDB
        // ----------------------------
        logStatus("Deleting IndexedDB...");

        await deleteIndexedDBs();

        // ----------------------------
        // Web Storage
        // ----------------------------
        logStatus("Clearing local/session storage...");

        localStorage.clear();
        sessionStorage.clear();

        // ----------------------------
        // Cookies
        // ----------------------------
        logStatus("Deleting cookies...");

        clearCookies();

        // ----------------------------
        // Small wait helps Chromium
        // release quota references
        // ----------------------------
        logStatus("Waiting for browser cleanup...");

        await new Promise(r =>
            setTimeout(r, 2500)
        );

        // ----------------------------
        // Refresh display
        // ----------------------------
        await refresh();

        logStatus("Storage wipe complete.");

        // ----------------------------
        // Better reload strategy
        // ----------------------------
        setTimeout(() => {

            location.href =
                location.origin +
                location.pathname +
                "?cachebust=" +
                Date.now();

        }, 1500);

    } catch (err) {

        console.error(err);

        logStatus("ERROR: " + err);
    }
}

// ----------------------------------------------------
// Refresh diagnostics
// ----------------------------------------------------
async function refresh() {

    const estimate =
        await navigator.storage.estimate();

    const cacheNames =
        await caches.keys();

    const actualBytes =
        await getActualCacheSize();

    const report = {

        browserEstimate: {

            totalUsage:
                kb(estimate.usage),

            quota:
                kb(estimate.quota),

            details:
                estimate.usageDetails
        },

        actualContent: {

            cacheApiSize:
                kb(actualBytes),

            cacheBuckets:
                cacheNames,

            cookiesCount:
                document.cookie
                    ? document.cookie.split(";").length
                    : 0,

            localStorageKeys:
                localStorage.length,

            sessionStorageKeys:
                sessionStorage.length
        }
    };

    document.getElementById("out")
        .textContent =
        JSON.stringify(report, null, 2);
}

refresh();

</script>

</body>
</html>
