<!DOCTYPE html>
<html>
<body>

<h2>Storage Debugger</h2>

<button onclick="refresh()">Refresh</button>
<button onclick="clearCaches()">Clear Caches</button>

<pre id="out"></pre>

<script>

function bytes(v) {
  return (v / 1024).toFixed(2) + " KB";
}

async function getRealCacheSize() {

  let total = 0;

  const names = await caches.keys();

  for (const name of names) {

    const cache = await caches.open(name);

    const requests = await cache.keys();

    for (const req of requests) {

      const res = await cache.match(req);

      if (!res) continue;

      const blob = await res.clone().blob();

      total += blob.size;
    }
  }

  return total;
}

async function refresh() {

  const estimate = await navigator.storage.estimate();

  const cacheNames = await caches.keys();

  const realCacheSize = await getRealCacheSize();

  document.getElementById("out").textContent =
    JSON.stringify({
      estimatedUsage: estimate.usage,
      estimatedUsageReadable: bytes(estimate.usage),

      estimatedDetails: estimate.usageDetails,

      actualCacheBytes: realCacheSize,
      actualCacheReadable: bytes(realCacheSize),

      cacheNames
    }, null, 2);
}

async function clearCaches() {

  const names = await caches.keys();

  await Promise.all(
    names.map(n => caches.delete(n))
  );

  // force small delay
  await new Promise(r => setTimeout(r, 1500));

  // try to encourage cleanup
  if (window.gc) {
    gc();
  }

  await refresh();
}

refresh();

</script>

</body>
</html>
