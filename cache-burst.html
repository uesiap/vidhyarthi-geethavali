<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Storage Debugger</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f4f4f4; }
        #out { background: #fff; padding: 15px; border: 1px solid #ccc; border-radius: 5px; overflow-x: auto; }
        button { padding: 10px 15px; cursor: pointer; margin-right: 5px; }
        .danger { background: #ff4444; color: white; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Site Storage & Data Debugger</h2>
    
    <button onclick="refresh()">Refresh Status</button>
    <button class="danger" onclick="clearAllSiteData()">Clear All Site Data & Cookies</button>

    <p><strong>Storage Details:</strong></p>
    <pre id="out">Loading...</pre>

    <script>
        // Utility to format bytes to KB/MB
        function formatBytes(v) {
            if (!v) return "0 KB";
            return (v / 1024).toFixed(2) + " KB";
        }

        // Deep scan of Cache API size
        async function getRealCacheSize() {
            let total = 0;
            const names = await caches.keys();
            for (const name of names) {
                const cache = await caches.open(name);
                const requests = await cache.keys();
                for (const req of requests) {
                    const res = await cache.match(req);
                    if (!res) continue;
                    const blob = await res.clone().blob();
                    total += blob.size;
                }
            }
            return total;
        }

        // The "Manual Clear" equivalent
        async function clearAllSiteData() {
            const confirmed = confirm("This will delete all cookies, local storage, and databases for this site. Continue?");
            if (!confirmed) return;

            // 1. Clear Cache Storage
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map(name => caches.delete(name)));

            // 2. Clear LocalStorage and SessionStorage
            localStorage.clear();
            sessionStorage.clear();

            // 3. Clear Cookies
            const cookies = document.cookie.split(";");
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i];
                const eqPos = cookie.indexOf("=");
                const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
                document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
            }

            // 4. Clear IndexedDB
            if (window.indexedDB.databases) {
                const dbs = await window.indexedDB.databases();
                dbs.forEach(db => {
                    window.indexedDB.deleteDatabase(db.name);
                });
            }

            // 5. Unregister Service Workers
            if (navigator.serviceWorker) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (let registration of registrations) {
                    await registration.unregister();
                }
            }

            alert("Site data cleared. Refreshing UI...");
            await refresh();
        }

        // Update the display
        async function refresh() {
            const estimate = await navigator.storage.estimate();
            const cacheNames = await caches.keys();
            const realCacheSize = await getRealCacheSize();

            const data = {
                browserEstimate: {
                    usage: formatBytes(estimate.usage),
                    quota: formatBytes(estimate.quota),
                    details: estimate.usageDetails || "No details provided by browser"
                },
                actualCache: {
                    byteSize: realCacheSize,
                    readable: formatBytes(realCacheSize),
                    buckets: cacheNames
                },
                otherStorage: {
                    localStorageItems: Object.keys(localStorage).length,
                    cookiesFound: document.cookie ? document.cookie.split(';').length : 0
                }
            };

            document.getElementById("out").textContent = JSON.stringify(data, null, 2);
        }

        // Run on load
        refresh();
    </script>
</body>
</html>
