<!DOCTYPE html>
<html>
<body>
  <h2>Storage Info</h2>
  <pre id="output"></pre>

  <script>
async function getStorageBreakdown() {
  // Storage API estimate
  const estimate = await navigator.storage.estimate();

  // localStorage size
  let localStorageSize = 0;
  for (let key in localStorage) {
    if (localStorage.hasOwnProperty(key)) {
      localStorageSize +=
        (key.length + localStorage[key].length) * 2;
    }
  }

  // sessionStorage size
  let sessionStorageSize = 0;
  for (let key in sessionStorage) {
    if (sessionStorage.hasOwnProperty(key)) {
      sessionStorageSize +=
        (key.length + sessionStorage[key].length) * 2;
    }
  }

  console.log({
    totalUsage: estimate.usage,
    quota: estimate.quota,
    browserReported: estimate.usageDetails,
    localStorageBytes: localStorageSize,
    sessionStorageBytes: sessionStorageSize
  });
}

getStorageBreakdown();
</script>
</body>
</html>
