<!-- Full-page iframe and loader styles -->
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
    }

    iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
    }

    /* Loading screen */
    #loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    .loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e0f2f1;
        border-top-color: #128C7E;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    .loader-title {
        font-family: Arial, sans-serif;
        font-size: 16px;
        font-weight: 600;
        color: #128C7E;
        text-align: center;
    }

    .loader-message {
        font-family: Arial, sans-serif;
        font-size: 13px;
        color: #777777;
        text-align: center;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }
</style>

<div id="loader">

</div>

<!-- Website Admin iframe -->
<iframe
    id="adminFrame"
    src="https://www.ruvs.in/update/"
    title="Website Admin - Vidhyarthi Geethavali"
    loading="eager"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
</iframe>

<!-- Hide loader after iframe loads -->
<script>
    const adminFrame = document.getElementById("adminFrame");
    const loader = document.getElementById("loader");

    adminFrame.addEventListener("load", function () {
        loader.classList.add("hidden");
    });
</script>
